
<!DOCTYPE html>
<html lang="ne">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SUSHANTA CREATION - Admin</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f3f3f3;color:#171717;font-family:Arial,sans-serif}
header{background:#111;color:white;padding:20px;text-align:center}
main{max-width:850px;margin:20px auto;padding:12px}
.panel{background:white;padding:20px;border-radius:12px;margin-bottom:18px;box-shadow:0 2px 10px #0001}
h2{margin-top:0}
input,textarea,select{width:100%;padding:13px;margin:8px 0 15px;border:1px solid #ccc;border-radius:7px;font-size:16px}
textarea{min-height:130px}
button{border:0;border-radius:7px;padding:11px 15px;background:#111;color:white;margin:4px;cursor:pointer;font-size:14px}
.secondary{background:#666}
.danger{background:#bd2525}
.green{background:#187b43}
.hidden{display:none}
.message{font-weight:bold;margin:12px 0;overflow-wrap:anywhere}
.post{border:1px solid #ddd;border-radius:9px;padding:14px;margin-top:12px}
.post img{width:100%;max-height:180px;object-fit:cover;border-radius:7px}
.status{font-size:13px;color:#555}
#preview{max-width:100%;max-height:200px;display:none;margin:10px 0;border-radius:8px}
.small{font-size:13px;color:#666}
</style>
</head>
<body>

<header>
<h2>SUSHANTA CREATION</h2>
<p>Admin Dashboard</p>
</header>

<main>
<section class="panel" id="loginPanel">
<h2>Admin Login</h2>
<input id="email" type="email" placeholder="Email address">
<input id="password" type="password" placeholder="Password">
<button onclick="login()">Login</button>
<p id="loginMessage" class="message"></p>
</section>

<section id="dashboard" class="hidden">

<div class="panel">
<h2>Welcome, Admin</h2>
<button class="secondary" onclick="logout()">Logout</button>
</div>

<div class="panel">
<h2 id="formHeading">नयाँ लेख लेख्नुहोस्</h2>

<label>लेखको शीर्षक</label>
<input id="title" placeholder="लेखको शीर्षक">

<label>छोटो विवरण</label>
<textarea id="excerpt" placeholder="लेखको छोटो परिचय"></textarea>

<label>पूरा लेख</label>
<textarea id="content" placeholder="यहाँ पूरा लेख लेख्नुहोस्"></textarea>

<label>Cover Photo — मोबाइल Gallery बाट छान्नुहोस्</label>
<input id="coverFile" type="file" accept="image/*">
<img id="preview" alt="Photo preview">
<p class="small">अधिकतम फोटो आकार: 5 MB</p>

<label>Category</label>
<input id="category" placeholder="Technology, News, Entertainment">

<label>स्थिति</label>
<select id="status">
<option value="draft">Draft</option>
<option value="published">Published</option>
</select>

<button id="saveButton" onclick="savePost()">लेख Save गर्नुहोस्</button>
<button id="cancelButton" class="secondary hidden" onclick="resetForm()">Cancel Edit</button>
<p id="saveMessage" class="message"></p>
</div>

<div class="panel">
<h2>तपाईंका लेखहरू</h2>
<button class="secondary" onclick="loadPosts()">Refresh</button>
<div id="postsList">Loading...</div>
</div>

</section>
</main>

<script>
const SUPABASE_URL = "https://foxhqifcwluhnfzxacwe.supabase.co";
const SUPABASE_KEY = "sb_publishable_ms4zgkX62TS4URjwxant5Q_jw6Nj5d_";

const db = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

let editingPost = null;
let currentUser = null;

function message(id, text) {
  document.getElementById(id).textContent = text;
}

async function checkAdmin() {
  const {data: sessionData, error: sessionError} =
    await db.auth.getSession();

  if (sessionError) {
    message("loginMessage", sessionError.message);
    return;
  }

  const user = sessionData.session?.user;
  if (!user) return;

  currentUser = user;

  const {data, error} = await db
    .from("admin_users")
    .select("user_id")
    .eq("user_id", user.id)
    .maybeSingle();

  if (error) {
    message("loginMessage", "Database Error: " + error.message);
    return;
  }

  if (!data) {
    message("loginMessage", "यो Account Admin होइन।");
    return;
  }

  document.getElementById("loginPanel").classList.add("hidden");
  document.getElementById("dashboard").classList.remove("hidden");

  loadPosts();
}

async function login() {
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  message("loginMessage", "Login हुँदैछ...");

  const {error} = await db.auth.signInWithPassword({
    email, password
  });

  if (error) {
    message("loginMessage", error.message);
    return;
  }

  await checkAdmin();
}

async function logout() {
  await db.auth.signOut();
  location.reload();
}

function makeSlug(value) {
  return value.toLowerCase()
    .trim()
    .replace(/[^\w\u0900-\u097f -]/g, "")
    .replace(/\s+/g, "-") + "-" + Date.now();
}

function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g, c => ({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#39;"
  })[c]);
}

document.getElementById("coverFile").addEventListener("change", function() {
  const file = this.files[0];
  const preview = document.getElementById("preview");

  if (!file) {
    preview.style.display = "none";
    return;
  }

  if (!file.type.startsWith("image/")) {
    message("saveMessage", "कृपया Image फाइल मात्र छान्नुहोस्।");
    this.value = "";
    return;
  }

  if (file.size > 5 * 1024 * 1024) {
    message("saveMessage", "फोटो 5 MB भन्दा सानो हुनुपर्छ।");
    this.value = "";
    return;
  }

  preview.src = URL.createObjectURL(file);
  preview.style.display = "block";
  message("saveMessage", "फोटो छानियो।");
});

async function uploadPhoto(file) {
  if (!file) return null;

  const cleanName = file.name.replace(/[^a-zA-Z0-9._-]/g, "_");
  const path = currentUser.id + "/" + Date.now() + "-" + cleanName;

  const {error} = await db.storage
    .from("post-images")
    .upload(path, file, {
      cacheControl: "3600",
      upsert: false,
      contentType: file.type
    });

  if (error) throw error;

  const {data} = db.storage
    .from("post-images")
    .getPublicUrl(path);

  return data.publicUrl;
}

async function savePost() {
  const title = document.getElementById("title").value.trim();
  const excerpt = document.getElementById("excerpt").value.trim();
  const content = document.getElementById("content").value.trim();
  const category = document.getElementById("category").value.trim() || "General";
  const status = document.getElementById("status").value;
  const file = document.getElementById("coverFile").files[0];

  if (!title || !content) {
    message("saveMessage", "शीर्षक र पूरा लेख अनिवार्य छन्।");
    return;
  }

  if (file && (!file.type.startsWith("image/") || file.size > 5 * 1024 * 1024)) {
    message("saveMessage", "सही Image छान्नुहोस्। आकार 5 MB भन्दा कम हुनुपर्छ।");
    return;
  }

  const button = document.getElementById("saveButton");
  button.disabled = true;
  message("saveMessage", "Save हुँदैछ...");

  try {
    let coverUrl = editingPost?.cover_image_url || null;

    if (file) {
      coverUrl = await uploadPhoto(file);
    }

    const postData = {
      title,
      excerpt,
      content,
      category,
      cover_image_url: coverUrl,
      status,
      published_at: status === "published"
        ? (editingPost?.published_at || new Date().toISOString())
        : null
    };

    let result;

    if (editingPost) {
      result = await db.from("posts")
        .update(postData)
        .eq("id", editingPost.id);
    } else {
      postData.slug = makeSlug(title);
      result = await db.from("posts").insert(postData);
    }

    if (result.error) throw result.error;

    message("saveMessage", "लेख सफलतापूर्वक Save भयो!");
    resetForm();
    await loadPosts();

  } catch (error) {
    message("saveMessage", "Error: " + error.message);
  } finally {
    button.disabled = false;
  }
}

async function loadPosts() {
  const list = document.getElementById("postsList");
  list.textContent = "Loading...";

  const {data, error} = await db
    .from("posts")
    .select("id,title,status,created_at,cover_image_url")
    .order("created_at", {ascending:false});

  if (error) {
    list.textContent = "Error: " + error.message;
    return;
  }

  if (!data.length) {
    list.textContent = "अहिलेसम्म कुनै लेख छैन।";
    return;
  }

  list.innerHTML = data.map(post => `
    <div class="post">
      ${post.cover_image_url
        ? `<img src="${escapeHTML(post.cover_image_url)}" alt="Cover">`
        : ""}
      <h3>${escapeHTML(post.title)}</h3>
      <p class="status">Status: ${escapeHTML(post.status)}</p>
      <button onclick="editPost('${post.id}')">Edit</button>
      <button class="green" onclick="changeStatus('${post.id}','${post.status === "published" ? "draft" : "published"}')">
        ${post.status === "published" ? "Unpublish" : "Publish"}
      </button>
      <button class="danger" onclick="deletePost('${post.id}')">Delete</button>
    </div>
  `).join("");
}

async function editPost(id) {
  message("saveMessage", "लेख खोल्दैछ...");

  const {data, error} = await db
    .from("posts")
    .select("*")
    .eq("id", id)
    .single();

  if (error) {
    message("saveMessage", error.message);
    return;
  }

  editingPost = data;

  document.getElementById("title").value = data.title || "";
  document.getElementById("excerpt").value = data.excerpt || "";
  document.getElementById("content").value = data.content || "";
  document.getElementById("category").value = data.category || "";
  document.getElementById("status").value = data.status || "draft";
  document.getElementById("coverFile").value = "";

  const preview = document.getElementById("preview");

  if (data.cover_image_url) {
    preview.src = data.cover_image_url;
    preview.style.display = "block";
  } else {
    preview.style.display = "none";
  }

  document.getElementById("formHeading").textContent = "लेख Edit गर्नुहोस्";
  document.getElementById("saveButton").textContent = "Update गर्नुहोस्";
  document.getElementById("cancelButton").classList.remove("hidden");

  message("saveMessage", "लेख Edit गर्न तयार छ।");
  window.scrollTo({top:0,behavior:"smooth"});
}

async function changeStatus(id, newStatus) {
  const update = {
    status: newStatus,
    published_at: newStatus === "published"
      ? new Date().toISOString()
      : null
  };

  const {error} = await db.from("posts")
    .update(update)
    .eq("id", id);

  if (error) {
    alert("Error: " + error.message);
    return;
  }

  await loadPosts();
}

async function deletePost(id) {
  if (!confirm("यो लेख Delete गर्ने हो?")) return;

  const {error} = await db.from("posts")
    .delete()
    .eq("id", id);

  if (error) {
    alert("Error: " + error.message);
    return;
  }

  if (editingPost?.id === id) resetForm();

  alert("लेख Delete भयो।");
  await loadPosts();
}

function resetForm() {
  editingPost = null;

  ["title","excerpt","content","category","coverFile"].forEach(id => {
    document.getElementById(id).value = "";
  });

  document.getElementById("status").value = "draft";
  document.getElementById("preview").style.display = "none";
  document.getElementById("formHeading").textContent = "नयाँ लेख लेख्नुहोस्";
  document.getElementById("saveButton").textContent = "लेख Save गर्नुहोस्";
  document.getElementById("cancelButton").classList.add("hidden");
  message("saveMessage", "");
}

checkAdmin();
</script>
</body>
</html>
